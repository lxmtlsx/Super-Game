<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Super Gioco – Sito ufficiale</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 40px;
            line-height: 1.6; 
            text-align: center;
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            color: white;
        }

        h1 { 
            color: #ffffff; 
            margin-top: 10px;
        }

        .play-button {
            display: inline-block;
            background-color: #00c3ff;
            color: #000;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            text-decoration: none;
            margin-top: 25px;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }
        .play-button:hover {
            background-color: #00a0d1;
            transform: scale(1.05);
        }

        .arrow {
            font-size: 32px;
            color: #ffd700;
            margin-top: 15px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%   { opacity: 0; transform: translateY(0); }
            50%  { opacity: 1; transform: translateY(5px); }
            100% { opacity: 0; transform: translateY(0); }
        }

        a { 
            color: #ffe600; 
            font-size: 18px; 
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        h2 {
            color: #ffeb3b;
        }

        /* 🔐 Protezione immagini */
        .image-wrapper {
            position: relative;
            display: inline-block;
        }

        .image-wrapper img.protect {
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
        }

        .image-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <h1>Super Gioco – Sito ufficiale</h1>

    <a class="play-button" href="https://play.unity.com/en/games/bcc4265b-fdb4-460a-9ec5-50490b540887/webgl-builds" target="_blank">
        🎮 Gioca Ora
    </a>

    <div class="arrow">⬇️✨⬇️</div>

    <p>Avvia il gioco WebGL</p>

    <!-- 🔐 Esempio: se vuoi mostrare un'immagine protetta -->
    <!-- Sostituisci LEVEL2.png con la tua immagine -->
    <div class="image-wrapper">
        <img src="LEVEL2.png" class="protect">
        <div class="image-overlay"></div>
    </div>

    <h2>Contatti</h2>
    <p>Email di supporto: <strong>grigioamabile@gmail.com</strong></p>

    <h2>Documenti</h2>
    <p><a href="privacy.html">Informativa sulla Privacy</a></p>
    <p><a href="terms.html">Termini e Condizioni</a></p>

    <p>© 2026 Super Gioco</p>

    <!-- 🔐 Blocco tasto destro, drag, selezione -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('dragstart', event => event.preventDefault());
        document.addEventListener('selectstart', event => event.preventDefault());
    </script>

</body>
</html>
